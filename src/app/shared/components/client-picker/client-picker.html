<div class="party-picker-panel">
  <div class="panel-header-row">
    <label class="panel-title-label">
      <span class="material-icons title-icon">person</span>
      <span>Buyer (To)</span>
    </label>
    <div class="quick-party-select">
      <select class="party-dropdown" [value]="clientId() || ''" (change)="onSelectExisting($event)" aria-label="Select saved client">
        <option value="">Choose saved client...</option>
        @for (c of savedClients(); track c.id) {
          <option [value]="c.id">{{ c.name }}</option>
        }
      </select>
    </div>
  </div>

  <div class="party-fields-stack">
    <div class="party-field">
      <label class="field-label">Company / Client Name</label>
      <input
        type="text"
        class="form-input"
        [value]="client().name"
        (input)="onFieldChange('name', $any($event.target).value)"
        placeholder="e.g. Acme Corp or Jane Doe"
        required
      />
    </div>

    <div class="party-field">
      <div class="field-label-row">
        <label class="field-label">Address, Tax & Contact Details</label>
        <span class="field-sublabel">Address, city, tax/VAT, email, phone & website</span>
      </div>
      <textarea
        class="form-textarea party-details-textarea"
        rows="5"
        [value]="displayDetails()"
        (input)="onDetailsChange($any($event.target).value)"
        placeholder="25 City Road&#10;London, EC1Y 1AA&#10;Tax / VAT: GB987654321&#10;Email: finance@client.com · Tel: +44 20 7946 0912&#10;Website: https://client.com"
      ></textarea>
    </div>
  </div>

  <div class="party-extra-fields">
    <div class="party-field">
      <label class="field-label">Country</label>
      <app-country-picker [value]="client().country || ''" (valueChange)="onFieldChange('country', $event)" placeholder="Choose country…" ariaLabel="Buyer country"></app-country-picker>
    </div>
    <div class="party-field">
      <label class="field-label">Electronic address / code</label>
      <input type="text" class="form-input" [value]="client().electronicAddress || ''" (input)="onFieldChange('electronicAddress', $any($event.target).value)" placeholder="e.g. company identifier or network address" autocomplete="off" />
    </div>
    <div class="party-field">
      <label class="field-label">Electronic address scheme</label>
      <select class="form-input" [value]="client().electronicAddressScheme || ''" (change)="onFieldChange('electronicAddressScheme', $any($event.target).value)">
        <option value="">Select scheme (optional)</option>
        <option value="0225">0225 — SIREN</option>
        <option value="0002">0002 — SIRENE</option>
        <option value="0007">0007 — SIRET</option>
        <option value="0088">0088 — GLN / EAN</option>
        <option value="EM">EM — Email</option>
        <option value="0204">0204 — Leitweg-ID</option>
      </select>
    </div>
  </div>

  <div class="party-panel-footer">
    <a routerLink="/clients" class="manage-party-link">
      <span class="material-icons link-icon">group</span>
      <span>Manage clients</span>
    </a>
  </div>
</div>
