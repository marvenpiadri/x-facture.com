<div class="calculator-page-container" id="calculator-page-root">
  <!-- Top Breadcrumb & Header Deck -->
  <header class="calculator-header-deck" id="calc-header-deck">
    <div class="header-breadcrumbs" id="calc-breadcrumbs">
      <a routerLink="/tools" class="crumb-link" id="back-to-tools-link">
        <span class="material-icons">arrow_back</span> All Calculators
      </a>
      <span class="crumb-separator">/</span>
      <span class="crumb-current" id="current-crumb-label">{{ currentToolName() }}</span>
    </div>
    <div class="header-title-row" id="calc-title-row">
      <div class="header-icon-badge" id="calc-icon-badge">
        <span class="material-icons">{{ icon() }}</span>
      </div>
      <div>
        <h1 class="page-title" id="calc-display-title">{{ title() }}</h1>
        <p class="page-subtitle" id="calc-display-subtitle">
          {{ subtitle() }}
        </p>
      </div>
    </div>
  </header>

  <!-- Strict 2-Column Dashboard Grid -->
  <div class="calculator-dashboard-grid" id="calc-dashboard-layout-grid">
    <!-- Left Column: Interactive Tools & Math Core (65% width) -->
    <main class="calculator-main-pane" id="calc-main-content-pane">
      <ng-content select="[mainContent]"></ng-content>
    </main>

    <!-- Right Column: Strategic AdSense Skyscraper Container (35% width) -->
    @if (showAdsense()) {
      <aside class="calculator-adsense-pane" id="calc-adsense-sidebar-pane">
        <div class="adsense-skyscraper-card" id="calc-ads-card">
          <div class="adsense-card-header">
            <span class="ads-badge">SPONSORED</span>
            <span class="ads-slot-label">AdSense Slot</span>
          </div>
          
          <div class="adsense-placeholder-inner">
            <span class="material-icons ads-icon">ad_units</span>
            <p class="ads-title">Responsive Display Ad</p>
            <p class="ads-desc">
              Future Google AdSense zone. Optimized for Vertical Skyscraper units.
            </p>
            <div class="ads-dimension-tag">300 &times; 600</div>
          </div>

          <div class="adsense-card-footer">
            Finance Tool Ad Network
          </div>
        </div>
      </aside>
    }
  </div>
</div>
