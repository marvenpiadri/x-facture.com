<div class="edit-page-container">
  @if (loading()) {
    <div class="loading-state-box">
      <div class="spinner"></div>
      <p>Loading document editor...</p>
    </div>
  } @else if (currentDocument()) {
    @if (isNew()) {
      <section class="create-page-intro" aria-labelledby="create-page-title">
        <div class="create-page-intro-copy">
          <div class="create-page-kicker">Free online document generator</div>
          <h1 id="create-page-title">{{ createPageContent().title }}</h1>
          <p>{{ createPageContent().description }}</p>
        </div>
      </section>
    }
    <app-document-form-shell
      [document]="currentDocument()!"
      [config]="currentConfig()"
      [isNew]="isNew()"
      (save)="onSave($event)"
      (saveAndPreview)="onSaveAndPreview($event)"
    ></app-document-form-shell>
  }
</div>
