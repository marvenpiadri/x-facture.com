name: IndexNow
on:
  push:
    branches: [main]
    paths:
      - 'public/sitemap.xml'
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
        env:
          INDEXNOW_FULL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
